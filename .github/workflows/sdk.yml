#
# SDKs: libzxv (the one C ABI) and every language SDK that wraps it.
# Each language job builds libzxv itself and runs that SDK's tests against
# sdk/conformance/vectors.json and the generated fixtures.
name: SDKs

on:
  push:
    paths: ['sdk/**', 'kernel/src/**', 'kernel/third_party/**', '.github/workflows/sdk.yml']
  pull_request:
    paths: ['sdk/**', 'kernel/src/**', 'kernel/third_party/**', '.github/workflows/sdk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libzxv:
    name: libzxv ${{ matrix.os }} ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cc: gcc }
          - { os: ubuntu-24.04, cc: clang }
          - { os: ubuntu-24.04-arm, cc: gcc }
          - { os: macos-14, cc: clang }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build and run the C conformance tests
        run: make -C sdk/libzxv CC=${{ matrix.cc }} test
      - name: vectors.json is up to date
        run: |
          make -C sdk/libzxv CC=${{ matrix.cc }} vectors
          git diff --exit-code sdk/conformance/vectors.json
      - name: ABI unchanged against every released baseline (add-only)
        env:
          CC: ${{ matrix.cc }}
        run: |
          lib=sdk/libzxv/build/libzxv.so; [ "$RUNNER_OS" = macOS ] && lib=sdk/libzxv/build/libzxv.dylib
          for base in sdk/libzxv/abi/libzxv-*.json; do
            python3 sdk/libzxv/tools/abi_check.py check sdk/libzxv/include/zxv_api.h "$base" "$lib"
          done
      - name: Minimal build (no PQC, no engine)
        run: |
          make -C sdk/libzxv clean
          make -C sdk/libzxv CC=${{ matrix.cc }} ZXV_NO_PQC=1 ZXV_NO_TENSOR=1
      - name: Stage dist
        run: |
          make -C sdk/libzxv clean
          make -C sdk/libzxv CC=${{ matrix.cc }} dist
      - uses: actions/upload-artifact@v5
        with:
          name: libzxv-${{ matrix.os }}-${{ matrix.cc }}
          path: sdk/libzxv/build/dist

  libzxv-sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: ASan + UBSan
        run: make -C sdk/libzxv CC=gcc SANITIZE=1 test

  python:
    name: python ${{ matrix.os }} ${{ matrix.py }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        py: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py }}
      - run: make -C ../libzxv all fixtures
      - run: pip install -e '.[test]' mypy
      - run: python -m pytest -q
      - run: python -m mypy

  java:
    name: java ${{ matrix.os }} jdk${{ matrix.jdk }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        jdk: ['22', '25']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdk/java
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - run: make -C ../libzxv all fixtures
      - run: mvn -B clean verify

  dotnet:
    name: dotnet ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdk/dotnet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: make -C ../libzxv all fixtures
      - name: Build (Release, warnings as errors)
        run: dotnet build Zxv.sln -c Release -p:ZxvSkipNativeBuild=true
      - run: dotnet test Zxv.sln -c Release --no-build

  typescript:
    name: typescript ${{ matrix.os }} node${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        node: ['20', '22']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: make -C ../libzxv all fixtures
      - run: npm ci
      - name: Wasm backend (zig cc to wasm32-wasi)
        run: |
          python -m pip install ziglang
          npm run build:wasm
      - run: npm test

  solidity:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/solidity
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make -C ../libzxv all fixtures
      - run: npm ci
      - run: npm test

  ruby:
    name: ruby ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdk/ruby
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: sdk/ruby
      - run: make -C ../libzxv all fixtures
      - run: bundle exec rake test

  php:
    name: php ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdk/php
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ffi
          ini-values: ffi.enable=true
      - run: make -C ../libzxv all fixtures
      - run: php tests/run.php

  rust:
    name: rust ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdk/rust
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: make -C ../libzxv all fixtures
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/libzxv/build
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/sdk/libzxv/build

  go:
    name: go ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdk/go/zxv
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/zxv/go.mod
      - run: make -C ../../libzxv all fixtures
      - run: go vet ./...
      - run: go test -race ./...
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/sdk/libzxv/build
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/sdk/libzxv/build

  cpp:
    name: cpp ${{ matrix.os }} ${{ matrix.cxx }}${{ matrix.sanitize == 'ON' && ' sanitize' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cxx: g++, sanitize: 'OFF' }
          - { os: ubuntu-24.04, cxx: clang++, sanitize: 'OFF' }
          - { os: ubuntu-24.04, cxx: g++, sanitize: 'ON' }
          - { os: macos-14, cxx: clang++, sanitize: 'OFF' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: make -C sdk/libzxv all fixtures
      - run: cmake -S sdk/cpp -B build-cpp -DZXV_SANITIZE=${{ matrix.sanitize }}
        env:
          CXX: ${{ matrix.cxx }}
      - run: cmake --build build-cpp -j4
      - run: ctest --test-dir build-cpp --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1

  swift:
    name: swift ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: make -C sdk/libzxv all fixtures
      - run: swift --version && swift test
        working-directory: sdk/swift
