#
# Framework kits (sdk/frameworks): the Spring Boot starter over sdk/java and
# Zxv.AspNetCore over sdk/dotnet. Each job builds libzxv itself, then the
# SDK it wraps, then the kit, and runs the kit's integration tests against
# the real library.
name: SDK frameworks

on:
  push:
    paths:
      - 'sdk/frameworks/**'
      - 'sdk/java/**'
      - 'sdk/dotnet/**'
      - 'sdk/libzxv/**'
      - 'kernel/src/**'
      - 'kernel/third_party/**'
      - '.github/workflows/sdk-frameworks.yml'
  pull_request:
    paths:
      - 'sdk/frameworks/**'
      - 'sdk/java/**'
      - 'sdk/dotnet/**'
      - 'sdk/libzxv/**'
      - 'kernel/src/**'
      - 'kernel/third_party/**'
      - '.github/workflows/sdk-frameworks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spring:
    name: spring ${{ matrix.os }} jdk${{ matrix.jdk }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        jdk: ['22', '25']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdk/frameworks/spring-zxv
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - run: make -C ../../libzxv all fixtures
      - name: Install the Java SDK (org.zedec:zxv) into the local repository
        run: mvn -B -f ../../java/pom.xml install -DskipTests
      - name: Build (javac -Xlint:all, failOnWarning) and test
        run: mvn -B clean verify

  aspnetcore:
    name: aspnetcore ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdk/frameworks/aspnetcore-zxv
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - run: make -C ../../libzxv all fixtures
      - name: Build (Release, warnings as errors)
        run: dotnet build Zxv.AspNetCore.sln -c Release -p:ZxvSkipNativeBuild=true
      - run: dotnet test Zxv.AspNetCore.sln -c Release --no-build
